[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qcs-prototype"
version = "0.1.0.post1"
description = "Evidence-based static crypto scanner for source, executables and firmware"
readme = "readme.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/NOTICE.txt", "licenses/INDEX.txt", "licenses/project/qcs/LICENSE", "licenses/components/**/*", "licenses/reference_data/**/*"]
dependencies = ["yara-python==4.5.4", "pyelftools==0.32", "pefile==2024.8.26", "tree-sitter==0.25.2", "tree-sitter-javascript==0.25.0", "capstone==5.0.6", "tree-sitter-c==0.24.1", "tree-sitter-cpp==0.23.4", "unicorn==2.1.4"]

[project.optional-dependencies]
ml = ["scikit-learn==1.7.2", "numpy==2.2.6", "scipy==1.15.3", "joblib==1.5.2", "threadpoolctl==3.6.0"]

[project.scripts]
qcs = "qcs.cli:main"
qcs-rf = "qcs_ml.rf:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["qcs", "qcs.guomi", "qcs_ml"]
namespaces = false

[tool.setuptools.package-data]
qcs = ["rules/*.txt", "resources/yara/*.yar", "resources/yara/*/*.yar", "resources/yara/LICENSE", "resources/windriver/LICENSE", "resources/windriver/cryptodetector/*.py", "resources/windriver/cryptodetector/methods/*/*.py", "resources/windriver/cryptodetector/methods/*/*.txt"]
"qcs.guomi" = ["*.yar", "licenses/*"]

